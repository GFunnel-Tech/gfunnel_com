<link rel="stylesheet" href="__chatdock_css_url__" />

<div id="gf-chatdock" class="gf-chatdock" data-open-url="__messenger_url__">

    <!-- Collapsed launcher (bottom-right). Click opens the panel. -->
    <button type="button" class="gf-chatdock-launcher" aria-label="Open chats" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 2C6.5 2 2 6.14 2 11.25c0 2.88 1.43 5.45 3.67 7.14V22l3.36-1.84c.95.26 1.95.4 2.97.4 5.5 0 10-4.14 10-9.25S17.5 2 12 2Zm1.01 12.44-2.62-2.79-5.03 2.79 5.53-5.87 2.68 2.79 4.97-2.79-5.53 5.87Z"/></svg>
        <span class="gf-chatdock-launcher-label">Chats</span>
    </button>

    <!-- Expanded panel: Facebook "Chats" rail. -->
    <div class="gf-chatdock-panel" role="dialog" aria-label="Chats">
        <div class="gf-chatdock-head">
            <span class="gf-chatdock-title">Chats</span>
            <div class="gf-chatdock-head-actions">
                <a class="gf-chatdock-btn gf-chatdock-open" href="__messenger_url__" title="Open Messenger" aria-label="Open Messenger">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/></svg>
                </a>
                <button type="button" class="gf-chatdock-btn gf-chatdock-min" aria-label="Minimize chats">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>
                </button>
            </div>
        </div>

        <div class="gf-chatdock-search">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input type="search" class="gf-chatdock-search-input" placeholder="Search Messenger" autocomplete="off" aria-label="Search conversations" />
        </div>

        <div class="gf-chatdock-scroll">
            <bx_if:list>
                <ul class="gf-chatdock-list">__list__</ul>
                <div class="gf-chatdock-noresults" hidden>No conversations match your search.</div>
            </bx_if:list>
            <bx_if:empty>
                <div class="gf-chatdock-empty">
                    <div class="gf-chatdock-empty-title">No conversations yet</div>
                    <div class="gf-chatdock-empty-sub">Start a chat and it&#39;ll show up here.</div>
                </div>
            </bx_if:empty>
        </div>

        <a class="gf-chatdock-seeall" href="__messenger_url__">See all in Messenger</a>
    </div>
</div>

<script src="__chatdock_js_url__" defer></script>
