<script language="javascript">
    /* GFunnel authorized header: search focus + Cmd/Ctrl+K, live clock.
       The time-tracking pill and popup live in template/js/gf_timer.js. */

    function gfHeaderFocusSearch() {
        setTimeout(function() {
            $('.gf-search .bx-ti-search-box').find('input[type="text"], input[type="search"]').first().trigger('focus');
        }, 50);
    }

    /* Subheader menu personalization: every action posts to gf_menu.php and
       swaps the returned, re-rendered subheader in place. */
    function gfMenuPost(sAction, oData, bReopen) {
        oData = oData || {};
        oData.a = sAction;

        $.post(sUrlRoot + 'gf_menu.php', oData, function(oResp) {
            if(!oResp || typeof oResp.html == 'undefined')
                return;

            $('.gf-subheader').replaceWith(oResp.html);
            if(bReopen !== false)
                gfMenuPanelToggle(true);
        }, 'json');
    }

    function gfMenuPanelToggle(bForceOpen) {
        var ePanel = $('#gf-menu-panel');
        if(bForceOpen === true)
            ePanel.show();
        else
            ePanel.toggle();
    }

    function gfMenuMove(eButton, iDir) {
        var eRow = $(eButton).closest('.gf-mrow');
        if(iDir < 0)
            eRow.prev('.gf-mrow').before(eRow);
        else
            eRow.next('.gf-mrow').after(eRow);

        var aKeys = $('#gf-menu-panel .gf-mrow').map(function() {
            return $(this).attr('data-key');
        }).get();

        gfMenuPost('reorder', {v: JSON.stringify(aKeys)});
    }

    function gfMenuToggle(eButton) {
        gfMenuPost('toggle', {i: $(eButton).closest('.gf-mrow').attr('data-key')});
    }

    function gfMenuDelete(eButton) {
        gfMenuPost('del', {i: $(eButton).closest('.gf-mrow').attr('data-key')});
    }

    function gfMenuAdd(eButton) {
        var ePanel = $(eButton).closest('.gf-menu-panel'),
            sTitle = $.trim(ePanel.find('.gf-menu-add-title').val()),
            sUrl = $.trim(ePanel.find('.gf-menu-add-url').val());

        if(!sTitle || !sUrl)
            return;

        gfMenuPost('add', {title: sTitle, url: sUrl});
    }

    function gfMenuReset() {
        gfMenuPost('reset');
    }

    $(document).ready(function() {
        //--- Customize-menu panel closes on any click outside the subheader
        $(document).on('click.gf-menu', function(e) {
            if(!$(e.target).closest('.gf-subheader').length)
                $('#gf-menu-panel').hide();
        });

        //--- Exactly one collapse control. App-layout pages have a #sidebar and
        //--- their own togglers, so the site-menu hamburger is redundant there;
        //--- other pages have no sidebar, so hide the togglers instead.
        if(document.getElementById('sidebar'))
            $('.gf-chrome .gf-hamburger').hide();
        else
            $('.gf-chrome .gf-sidebar-toggler').hide();

        //--- Cmd+K / Ctrl+K opens the global search
        $(document).on('keydown.gf-header', function(e) {
            if((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() == 'k' && !e.altKey && !e.shiftKey) {
                e.preventDefault();

                var oPill = $('.gf-search .gf-search-pill');
                if(oPill.length && !oPill.closest('.bx-ti-search-button').hasClass('bx-tis-button-hidden')) {
                    bx_site_search_show(oPill.get(0));
                    gfHeaderFocusSearch();
                }
            }
        });

        //--- Live clock (updates on the minute boundary)
        var eClock = $('#gf-clock');
        if(eClock.length) {
            var aDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                aMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            var fClock = function() {
                var oNow = new Date(),
                    iHours = oNow.getHours(),
                    sMeridiem = iHours >= 12 ? 'PM' : 'AM',
                    iHours12 = iHours % 12 == 0 ? 12 : iHours % 12,
                    sMinutes = ('0' + oNow.getMinutes()).slice(-2);

                eClock.find('.gf-clock-time').text(iHours12 + ':' + sMinutes + ' ' + sMeridiem);
                eClock.find('.gf-clock-date').text(aDays[oNow.getDay()] + ', ' + aMonths[oNow.getMonth()] + ' ' + oNow.getDate());
            };

            fClock();
            setTimeout(function() {
                fClock();
                setInterval(fClock, 60000);
            }, 60000 - Date.now() % 60000);
        }
    });
</script>
