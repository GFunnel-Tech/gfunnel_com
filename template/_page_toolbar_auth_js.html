<script language="javascript">
    /* GFunnel authorized header: search focus + Cmd/Ctrl+K, live clock, work timer. */

    function gfHeaderFocusSearch() {
        setTimeout(function() {
            $('.gf-search .bx-ti-search-box').find('input[type="text"], input[type="search"]').first().trigger('focus');
        }, 50);
    }

    $(document).ready(function() {
        //--- Cmd+K / Ctrl+K opens the global search
        $(document).on('keydown.gf-header', function(e) {
            if((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() == 'k' && !e.altKey && !e.shiftKey) {
                e.preventDefault();

                var oPill = $('.gf-search .gf-search-pill');
                if(oPill.length && !oPill.closest('.bx-ti-search-button').hasClass('bx-tis-button-hidden')) {
                    bx_site_search_show(oPill.get(0));
                    gfHeaderFocusSearch();
                }
            }
        });

        //--- Live clock (updates on the minute boundary)
        var eClock = $('#gf-clock');
        if(eClock.length) {
            var aDays = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                aMonths = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

            var fClock = function() {
                var oNow = new Date(),
                    iHours = oNow.getHours(),
                    sMeridiem = iHours >= 12 ? 'PM' : 'AM',
                    iHours12 = iHours % 12 == 0 ? 12 : iHours % 12,
                    sMinutes = ('0' + oNow.getMinutes()).slice(-2);

                eClock.find('.gf-clock-time').text(iHours12 + ':' + sMinutes + ' ' + sMeridiem);
                eClock.find('.gf-clock-date').text(aDays[oNow.getDay()] + ', ' + aMonths[oNow.getMonth()] + ' ' + oNow.getDate());
            };

            fClock();
            setTimeout(function() {
                fClock();
                setInterval(fClock, 60000);
            }, 60000 - Date.now() % 60000);
        }

        //--- Work timer pill (state persisted in localStorage)
        var eTimer = $('#gf-timer');
        if(eTimer.length) {
            var sTimerKey = 'gf_work_timer',
                iTimerInterval = null;

            var fTimerLoad = function() {
                try {
                    var o = JSON.parse(localStorage.getItem(sTimerKey));
                    if(o && typeof o == 'object')
                        return {running: !!o.running, accumulated: parseInt(o.accumulated) || 0, started: parseInt(o.started) || 0};
                }
                catch(e) {}

                return {running: false, accumulated: 0, started: 0};
            };

            var fTimerSave = function(o) {
                try {
                    localStorage.setItem(sTimerKey, JSON.stringify(o));
                }
                catch(e) {}
            };

            var fTimerElapsed = function(o) {
                return o.accumulated + (o.running ? Math.max(0, Date.now() - o.started) : 0);
            };

            var fTimerFormat = function(iMs) {
                var iSeconds = Math.floor(iMs / 1000),
                    fPad = function(i) { return ('0' + i).slice(-2); };

                return fPad(Math.floor(iSeconds / 3600)) + ':' + fPad(Math.floor(iSeconds / 60) % 60) + ':' + fPad(iSeconds % 60);
            };

            var fTimerRender = function() {
                var o = fTimerLoad(),
                    bPaused = !o.running && o.accumulated > 0;

                eTimer.toggleClass('gf-timer-running', o.running).toggleClass('gf-timer-paused', bPaused);
                eTimer.find('.gf-timer-time').text(fTimerFormat(fTimerElapsed(o)));
                eTimer.find('.gf-timer-label').text(o.running ? 'Tracking' : (bPaused ? 'Paused' : 'No active timer'));
            };

            var fTimerArm = function() {
                var o = fTimerLoad();
                if(o.running && !iTimerInterval)
                    iTimerInterval = setInterval(fTimerRender, 1000);
                else if(!o.running && iTimerInterval) {
                    clearInterval(iTimerInterval);
                    iTimerInterval = null;
                }
            };

            eTimer.find('.gf-timer-toggle').on('click', function() {
                var o = fTimerLoad();
                if(o.running)
                    o = {running: false, accumulated: fTimerElapsed(o), started: 0};
                else
                    o = {running: true, accumulated: o.accumulated, started: Date.now()};

                fTimerSave(o);
                fTimerArm();
                fTimerRender();
            });

            eTimer.find('.gf-timer-time').on('dblclick', function() {
                fTimerSave({running: false, accumulated: 0, started: 0});
                fTimerArm();
                fTimerRender();
            });

            fTimerRender();
            fTimerArm();
        }
    });
</script>
