<bx_repeat:links>
<div class="voice" bookmark_id="__id__">
	<a class="label" href="javascript:void(0);" onmouseup="if (!$(this).parent().hasClass('ui-sortable-helper')) aqb_personal_bookmarks_open_link('<bx_url_root />__url__'); return false;">__name__</a>
	<i class="sys-icon trash aqb_personal_bookmarks_trash" title="Delete" onmouseup="if (!$(this).parent().hasClass('ui-sortable-helper')) aqb_personal_bookmarks_delete(__id__);"></i>
</div>
</bx_repeat:links>
