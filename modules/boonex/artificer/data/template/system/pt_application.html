<bx_include_auto:_header.html />
<div class="bx-main bx-pt-application <bx_injection:injection_main_class />">
    <bx_injection:top />
    __gf_toolbar_app__

    <div class="bx-main-content flex pt-16 overflow-hidden">
        <!-- BEG: Sidebar -->
        <aside id="sidebar" class="bx-main-column narrow fixed top-0 left-0 z-20 hidden xl:flex flex-col flex-shrink-0 w-64 h-full pt-16 duration-75 transition-width" aria-label="Sidebar">
            <!-- GFunnel-owned left navigation (BxBaseFunctions::getGfSidebar).
                 Replaces the stock sys_site_panel menu; the aside wrapper above
                 keeps the responsive/fixed positioning. -->
            __gf_sidebar__
        </aside>
        <div class="fixed inset-0 z-10 hidden bg-gray-900/50 dark:bg-gray-900/90" id="sidebarBackdrop"></div>
        <!-- END: Sidebar -->    

        <!-- BEG: Main Content -->
        <div id="main-content" class="bx-main-column wide relative w-full h-full overflow-y-auto xl:ml-64">
            <main>
                <bx_injection:injection_between_cover_logo />
                __cover__
                <bx_injection:injection_between_cover_top_menu />
                <div id="bx-menu-main-bar-wrapper" class="bx-menu-main-bar-wrapper bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 __site_submenu_hidden__">
                    <div id="bx-menu-main-bar" class="bx-menu-main-bar __site_submenu_class__ mx-auto px-4 sm:px-6 lg:px-8 box-border">
                        <div class="bx-menu-main-bar-cnt -mb-px">
                            <bx_injection:injection_top_menu_before />
                            <div class="flex items-center h-full text-center">
                                <div class="relative flex-1 h-full">
                                    <div class="absolute w-full h-full">
                                        <bx_menu:sys_site_submenu />
                                    </div>
                                </div>
                                <div class="flex-none">
                                    <bx_menu:sys_site_manage />
                                </div>
                            </div>
                            <bx_injection:injection_top_menu_after />
                        </div>
                    </div>
                </div>
                <bx_injection:injection_between_content_menu />
                <div id="bx-content-wrapper" class="bx-def-page-width mx-auto">
                    __informer__
                    <div class="bx-page-wrapper mx-auto px-3 md:px-4 lg:px-6 box-border">
                        <div id="bx-content-container" class="bx-content-container">
                            <div id="bx-content-main" class="bx-content-main my-2 lg:my-3">
                                <bx_injection:injection_content_before />
                                __page_main_code__
                                <bx_injection:injection_content_after />
                                <bx_injection:banner_bottom />
                            </div> <!-- #bx-content-main -->
                            <bx_injection:injection_between_content_footer />
                        </div> <!-- #bx-content-container -->
                    </div> <!-- .bx-page-wrapper -->
                </div> <!-- #bx-content-wrapper -->
            </main>
            <footer class="p-4 m-4 bg-white rounded-lg shadow md:flex md:items-center md:justify-between md:p-6 xl:p-8 dark:bg-gray-800">
                <bx_injection:injection_footer_before />
                <div id="bx-menu-bottom">
                    <bx_menu:sys_footer />
                </div>
                <bx_injection:injection_footer_after />
            </footer>
        </div>
        <!-- END: Main Content -->
    </div>
    <bx_menu:sys_site_action />
</div> <!-- .bx-main -->
<bx_include_auto:_footer.html />
