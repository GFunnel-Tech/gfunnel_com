<!--
    GFunnel — Organization Overview block.

    Rendered by BxOrgsModule::serviceOverview(). Intentionally contains NO
    placeholder data: every action links to a real GFunnel page. Values come in
    as UNA placeholders (org title + real action URLs).
-->
<div class="gforg">
    <div class="gforg-stack">

        <!-- Assistant / welcome -->
        <section class="gforg-card gforg-card-pad">
            <div class="gforg-ai-greeting">
                <span class="gforg-ai-spark" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/></svg>
                </span>
                <div class="gforg-ai-bubble" id="gforg-greeting">Good evening — what would you like to get done today?</div>
            </div>

            <a class="gforg-ai-cta" href="__ai_url__">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/></svg>
                Ask AI
                <span class="gforg-ai-cta-arrow" aria-hidden="true">→</span>
            </a>

            <div class="gforg-ai-chips">
                <a class="gforg-ai-chip" href="__post_url__"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Post an update</a>
                <a class="gforg-ai-chip" href="__event_url__"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Create an event</a>
                <a class="gforg-ai-chip" href="__space_url__"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h5l2 3h5a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg>New space</a>
            </div>
        </section>

        <!-- Calendar -->
        <section class="gforg-card gforg-card-pad">
            <div class="gforg-rail-head">
                <div>
                    <h3>Calendar</h3>
                    <p>Appointments and synced events</p>
                </div>
                <a class="gforg-sec-link" href="__events_url__">Open
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
                </a>
            </div>
            <div class="gforg-cal">
                <span class="gforg-cal-ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>
                <div class="gforg-cal-title">Connect your calendar</div>
                <div class="gforg-cal-text">See your meetings from Google, Calendly, Cal.com, and GoHighLevel in one place.</div>
                <a class="gforg-btn-orange" href="__events_url__">Connect calendar →</a>
            </div>
        </section>
    </div>
</div>

<script>
(function() {
    var el = document.getElementById('gforg-greeting');
    if (!el) return;
    var h = new Date().getHours(), g = 'Good evening';
    if (h < 5) g = 'Late night'; else if (h < 12) g = 'Good morning'; else if (h < 17) g = 'Good afternoon';
    el.textContent = g + ' — what would you like to get done today?';
})();
</script>
