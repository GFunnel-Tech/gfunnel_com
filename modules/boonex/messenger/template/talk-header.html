<div class="bx-db-header bx-messenger-history-block-header">
    __menu_button__
    <div class="bx-db-title">
        __title__
        <bx_if:gf_ws_origin>
            <span class="bx-messenger-gf-origin bx-messenger-gf-origin-ws" title="__gf_ws_kind__ &middot; __gf_ws_name__">
                <span class="bx-messenger-gf-origin-dot"></span>
                <span class="bx-messenger-gf-origin-label">via __gf_ws_name__</span>
            </span>
        </bx_if:gf_ws_origin>
        <bx_if:gf_dm_origin>
            <span class="bx-messenger-gf-origin bx-messenger-gf-origin-dm">
                <span class="bx-messenger-gf-origin-label">Direct message</span>
            </span>
        </bx_if:gf_dm_origin>
    </div>
    <div class="bx-db-menu">__buttons__</div>
</div>
