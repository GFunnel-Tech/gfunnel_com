<!--
    GFunnel - Person profile overview (identity card).

    Rendered by BxPersonsModule::serviceOverview(). Designed to sit in the
    profile cover section (above the tabs), UNDER the native page cover - so it
    renders no cover of its own and no metric-card grid. Real data only:
      · Identity   - avatar / name / bio / location / member-since
      · Actions    - Share, Edit (owner) or Connect/Message/Follow (visitor)
      · Stat strip - live Connections / Followers / Views
-->
<div class="gfperson">
    <section class="gfperson-card">
        <div class="gfperson-body">
            <span class="gfperson-avatar" style="__thumb_style__"><span class="gfperson-avatar-letter">__initial__</span></span>

            <div class="gfperson-id">
                <h2 class="gfperson-name">__title__</h2>

                <bx_if:bio>
                <p class="gfperson-bio">__bio__</p>
                </bx_if:bio>

                <div class="gfperson-meta">
                    <bx_if:location>
                    <span class="gfperson-meta-item">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>
                        __location__
                    </span>
                    </bx_if:location>
                    <bx_if:member_since>
                    <span class="gfperson-meta-item">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                        Member since __member_since__
                    </span>
                    </bx_if:member_since>
                </div>
            </div>

            <div class="gfperson-actions">
                <a class="gfperson-btn gfperson-btn-soft" href="__profile_url__">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
                    Share
                </a>
                <bx_if:editable>
                <a class="gfperson-btn gfperson-btn-primary" href="__edit_url__">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
                    Edit profile
                </a>
                </bx_if:editable>
                <bx_if:visitor_actions>
                <span class="gfperson-native-actions">__actions_menu__</span>
                </bx_if:visitor_actions>
            </div>
        </div>

        <div class="gfperson-stats">
            <div class="gfperson-stat"><span class="gfperson-stat-n">__connections__</span><span class="gfperson-stat-l">Connections</span></div>
            <div class="gfperson-stat"><span class="gfperson-stat-n">__followers__</span><span class="gfperson-stat-l">Followers</span></div>
            <div class="gfperson-stat"><span class="gfperson-stat-n">__views__</span><span class="gfperson-stat-l">Profile views</span></div>
        </div>
    </section>
</div>
