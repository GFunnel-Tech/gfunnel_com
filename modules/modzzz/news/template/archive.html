<div class="mz-news-categories">
    <div class="mz-news-categories-cnt">
        <bx_repeat:years>
            <div class="mz-news-category bx-def-padding-thd-topbottom">
                <bx_if:show_icon><span class="bx-def-padding-sec-right"><i class="sys-icon calendar-times"></i></span></bx_if:show_icon>
                <a href="__url__">__title__</a> 
            </div> 
			<bx_if:show_months>
				<div class="mz-news-subcategories bx-def-margin-left bx-def-padding-sec-left">__months__</div> 
			</bx_if:show_months>
        </bx_repeat:years>
    </div>
</div>
